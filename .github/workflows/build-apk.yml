name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build Web2APK Android Package
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -exec bash -c 'yes | "$1" --licenses || true' _ {} \;
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "9.3.1"

      - name: Prepare Build Environment & Keystores
        run: |
          # 1. Ensure .env file exists for Secrets Gradle Plugin
          touch .env

          # 2. Decode or generate clean debug.keystore
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

          if [ ! -s debug.keystore ]; then
            echo "Generating fresh debug.keystore with keytool..."
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Verify debug keystore validity
          keytool -list -keystore debug.keystore -storepass android > /dev/null && echo "Debug keystore verified successfully!"

          # 3. Decode release keystore if provided in repository secrets
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          fi

      - name: Build Android APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f my-upload-key.jks ]; then
            echo "Compiling Release APK..."
            gradle assembleRelease --no-configuration-cache --stacktrace
          else
            echo "Compiling Debug APK..."
            gradle assembleDebug --no-configuration-cache --stacktrace
          fi

      - name: Verify APK Output
        run: |
          echo "Scanning for generated APK files..."
          find app/build/outputs -name "*.apk" -type f -exec ls -lh {} +

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web2APK-Android-Package
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error
